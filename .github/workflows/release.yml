name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test tests/MacKeyboard.Tests/MacKeyboard.Tests.csproj -c Release

      - name: Publish single-file exe
        run: dotnet publish src/MacKeyboard/MacKeyboard.csproj -c Release -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: MacKeyboard-exe
          path: publish/MacKeyboard.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/MacKeyboard.exe
