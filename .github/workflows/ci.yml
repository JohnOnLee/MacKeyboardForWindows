name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  # The remapper state machine has no Win32 in it, so its tests — including the randomised
  # "nothing is left held" invariant that guards against stuck modifiers — run anywhere.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/MacKeyboard.Tests/MacKeyboard.Tests.csproj -c Release --logger "console;verbosity=normal"

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet publish src/MacKeyboard/MacKeyboard.csproj -c Release -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: MacKeyboard-exe
          path: publish/MacKeyboard.exe
